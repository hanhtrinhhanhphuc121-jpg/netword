    <!-- Prevent harmless Vite HMR WebSocket connection errors in Cloud Run dev environment -->
    <script>
      (function() {
        // 1. Intercept WebSocket instantiation for Vite HMR to prevent connection errors
        try {
          var OrigWebSocket = window.WebSocket;
          if (OrigWebSocket) {
            function MockHmrWebSocket(url, protocols) {
              var urlStr = String(url || '');
              var protoStr = Array.isArray(protocols) ? protocols.join(' ') : String(protocols || '');
              if (protoStr.includes('vite-hmr') || urlStr.includes('token=') || urlStr.includes('/@vite/client')) {
                var target = new EventTarget();
                target.CONNECTING = 0;
                target.OPEN = 1;
                target.CLOSING = 2;
                target.CLOSED = 3;
                target.readyState = 1; // OPEN
                target.send = function() {};
                target.close = function() {
                  target.readyState = 3;
                  target.dispatchEvent(new Event('close'));
                };
                setTimeout(function() {
                  target.dispatchEvent(new Event('open'));
                }, 0);
                return target;
              }
              return new OrigWebSocket(url, protocols);
            }
            MockHmrWebSocket.prototype = OrigWebSocket.prototype;
            MockHmrWebSocket.CONNECTING = 0;
            MockHmrWebSocket.OPEN = 1;
            MockHmrWebSocket.CLOSING = 2;
            MockHmrWebSocket.CLOSED = 3;
            window.WebSocket = MockHmrWebSocket;
          }
        } catch (_) {}

        // 2. Filter console.error from logging WebSocket warnings to the AI Studio error listener
        var origConsoleError = console.error;
        console.error = function() {
          try {
            var args = Array.prototype.slice.call(arguments);
            var fullText = args.map(function(a) {
              return (a instanceof Error) ? (a.message + ' ' + (a.stack || '')) : String(a || '');
            }).join(' ');
            if (
              fullText.includes('WebSocket closed without opened') ||
              fullText.includes('failed to connect to websocket') ||
              fullText.includes('WebSocket connection to') ||
              (fullText.includes('[vite]') && fullText.includes('WebSocket')) ||
              (fullText.includes('[vite]') && fullText.includes('websocket'))
            ) {
              return;
            }
          } catch (_) {}
          return origConsoleError.apply(console, arguments);
        };

        // 3. Catch window unhandled errors and rejections
        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? String(e.message) : '';
          if (msg.includes('WebSocket') || msg.includes('closed without opened')) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e ? (e.reason && (e.reason.message || e.reason.stack || String(e.reason))) : '';
          if (reason && (reason.includes('WebSocket') || reason.includes('closed without opened'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
