    <!-- Filter harmless Vite HMR WebSocket connection warnings in Cloud Run -->
    <script>
      (function() {
        const origConsoleError = console.error;
        console.error = function(...args) {
          if (args.length > 0) {
            const msg = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].message) ? args[0].message : '';
            if (msg.includes('WebSocket closed without opened') || msg.includes('WebSocket connection to') || (msg.includes('[vite]') && msg.includes('WebSocket'))) {
              return;
            }
          }
          origConsoleError.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.includes('WebSocket closed without opened') || e.message.includes('WebSocket connection to'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
